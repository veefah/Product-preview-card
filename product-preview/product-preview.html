<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/product-preview.css">
	<title>Product preview card component</title>
</head>
<body>
	<main>
		<article class="card">
			<picture>
				<source srcset="img/image-product-mobile.jpg" media="(max-width: 600px)">
  				<img src="img/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum">
			</picture>

			<div class="product-info">
				<p class="perfume">PERFUME</p>
				<h1>Gabrielle Essence Eau De Parfum</h1>
				<div class="description">
					<p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
				</div>
				<div class="price">
					<p class="current-price">$149.99</p>
					<del class="old-price">$169.99</del>
				</div>
				<button class="buy">
				<img src="img/icon-cart.svg" alt="Cart">
				<p>Add to Cart</p>
				</button>
			</div>
		
	</article>
</main>
</body>
</html>
